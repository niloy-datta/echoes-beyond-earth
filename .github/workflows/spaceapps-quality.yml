name: Space Apps Quality Gate
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm test
      - run: npm run typecheck
      - run: node scripts/sources/verify-sources.mjs
      - run: npm run build
      - run: npm run quality:eko
