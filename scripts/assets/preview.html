<!doctype html>
<!-- Dev-only asset viewer: python -m http.server 8123 (repo root), open /scripts/assets/preview.html?model=explorer-high&clip=walk -->
<html><head><meta charset="utf-8"><title>Asset preview</title>
<style>html,body{margin:0;height:100%;background:#1a120d}canvas{display:block}#info{position:fixed;left:8px;top:8px;color:#eee;font:12px monospace}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
</head><body><div id="info"></div><script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
const q = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight); renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.shadowMap.enabled = true;
document.body.append(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x2a1a12);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.6;
const sun = new THREE.DirectionalLight(0xfff0dd, 2.5); sun.position.set(-2, 4, 3); sun.castShadow = true; scene.add(sun);
const ground = new THREE.Mesh(new THREE.CircleGeometry(4, 48).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x9a5a3a, roughness: 1 })); ground.receiveShadow = true; scene.add(ground);
const cam = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.05, 50);
const yaw = Number(q.get("yaw") ?? 0.5), dist = Number(q.get("dist") ?? 3.2), h = Number(q.get("h") ?? 1.0);
cam.position.set(Math.sin(yaw) * dist, h + 0.3, Math.cos(yaw) * dist); cam.lookAt(0, h, 0);
const gltf = await new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).loadAsync(`/public/models/game/${q.get("model") ?? "explorer-high"}.glb`);
gltf.scene.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.frustumCulled = false; } });
const s = Number(q.get("scale") ?? 1); gltf.scene.scale.setScalar(s); gltf.scene.position.y = Number(q.get("y") ?? 0);
scene.add(gltf.scene);
const mixer = new THREE.AnimationMixer(gltf.scene);
const clip = gltf.animations.find((a) => a.name === q.get("clip"));
if (clip) mixer.clipAction(clip).play();
let morph = null; gltf.scene.traverse((o) => { if (o.morphTargetDictionary) morph = o; });
if (morph && q.get("morph")) morph.morphTargetInfluences[morph.morphTargetDictionary[q.get("morph")]] = 1;
mixer.update(Number(q.get("t") ?? 0));
document.getElementById("info").textContent = `${gltf.animations.map((a) => a.name).join(", ")} | morph: ${morph ? Object.keys(morph.morphTargetDictionary).join(",") : "-"}`;
renderer.render(scene, cam);
window.__ready = true;
</script></body></html>
